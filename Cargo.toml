[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.5"
edition = "2024"
license = "MIT"
authors = ["David Ulrich <david@ulrichdev.com>"]
description = "The language-agnostic desktop environment that turns your entire developer machine into an IDE"
repository = "https://github.com/dulrich/crucible-dev-env"
rust-version = "1.85"

# Shared dependency versions. Crates opt in via `dep.workspace = true`.
# Dependency posture: allowed, but limited to clear, significant wins over an
# in-project implementation. See AGENTS.md.
[workspace.dependencies]
# PNG encoding with real deflate for built-in screenshots (plan 34).
png = "0.18"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
xcursor = "0.3"
serde = { version = "1", features = ["derive"] }

# Raw-mode terminal control (termios, window size, stdio handles) for `crucible pick` and
# `crucible resume`. Already in `Cargo.lock` at 1.1.4 via calloop, so no new lock version.
rustix = { version = "1", features = ["termios", "stdio", "net", "process"] }

# `sigaction` for `crucible resume`: a no-op SIGINT/SIGQUIT handler keeps it resident while a
# restored command runs. Already in `Cargo.lock` at 0.2.186, so no new lock version.
libc = "0.2"

# KDL 2.0 parser for `crucible-config` (phase-3 config file) and `crucible-persist` (workspace
# files). `default-features` keeps the `span` feature, which the typed errors use for line/column
# locations.
kdl = "6"

# X11 protocol bindings used by the XWayland integration (WS-5). Smithay's
# `x11rb_event_source` feature drives the X11 WM connection from calloop; anvil
# pairs the same `x11rb` crate with that feature. Version resolves against the
# pinned Smithay rev (anvil uses the same dependency).
x11rb = "0.13"

# Keysym type + constant table for `crucible-keys`' canonical chord policy (WP-R2). This is
# exactly the crate `xkbcommon::xkb::Keysym` (Smithay's `Keysym`) re-exports, so the compositor
# passes its keysyms into `crucible-keys` with no conversion, while `crucible-keys` itself stays
# free of the `xkbcommon`/Smithay FFI dependency — a plain, dependency-free constant table, not a
# parallel keysym implementation. `default-features = false` drops the optional `bytemuck`/`serde`
# integrations neither side needs.
xkeysym = { version = "0.2", default-features = false }

# TrueType glyph rasterization + horizontal layout for compositor-drawn text (plan 06 WP-5,
# header row). Pure Rust; pulls ttf-parser (RUSTSEC-2026-0192 unmaintained — allowed warning).
fontdue = "0.9"

# Server code for CDE's own `crucible-window-identity-v1` protocol (`protocols/`, crucible-term
# plan 02 WP-4). All three are already in `Cargo.lock` via Smithay at these versions.
wayland-scanner = "0.31.11"
wayland-server = "0.31.13"
wayland-backend = "0.3.15"
# Test-only: asserts the identity protocol XML sha256. Already in `Cargo.lock` at 0.10.9.
sha2 = "0.10.9"

# Lints are defined once here and inherited by every crate with `[lints]
# workspace = true`. CI runs `cargo clippy -- -D warnings`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
